<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment | Yuva Skill Map</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="navbar"><a class="brand" href="/dashboard">Yuva Skill Map</a><nav><a href="/dashboard">Dashboard</a><a href="/profile">Profile</a><a href="/logout">Logout</a></nav></header><main class="section"><div class="assessment-card"><span class="badge">15 Questions</span><h1>{{degree}} Assessment</h1><p>Course: <strong>{{course}}</strong> — Answer every question.</p><div class="assessment-progress"><div><b>Assessment Progress</b><span id="progressText">0 / {{questions|length}} answered</span></div><div class="progress-track"><div id="progressBar" class="progress-fill"></div></div></div><form method="POST" action="/result" onsubmit="return confirm('Submit your assessment? Please make sure every question is answered.');">{% for q in questions %}<div class="question"><div class="question-head"><h3>{{q[0]}}. {{q[2]}}</h3><span class="category">{{q[1]}}</span></div>{% for o in q[3] %}<label class="option"><input type="radio" name="q{{q[0]}}" value="{{o}}" required> <span>{{o}}</span></label>{% endfor %}</div>{% endfor %}<button class="btn primary full" type="submit">Submit Assessment</button></form></div></main><footer>© 2026 Yuva Skill Map</footer><script>const total={{questions|length}};const inputs=[...document.querySelectorAll('input[type=radio]')];function updateProgress(){const answered=new Set(inputs.filter(x=>x.checked).map(x=>x.name)).size;document.getElementById('progressText').textContent=answered+' / '+total+' answered';document.getElementById('progressBar').style.width=(answered/total*100)+'%';}inputs.forEach(x=>x.addEventListener('change',updateProgress));updateProgress();</script></body></html>

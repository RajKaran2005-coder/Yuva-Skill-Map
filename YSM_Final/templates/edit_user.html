<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Student</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header class="navbar"><a class="brand" href="/admin/dashboard">YSM Owner</a>
<nav><a href="/admin/dashboard">Admin Dashboard</a><a href="/admin/logout">Logout</a></nav></header>
<main class="form-page"><div class="form-card wide"><span class="badge">Owner Only</span><h1>Edit Student</h1>
{% if error %}<div class="alert error">{{error}}</div>{% endif %}
<form method="POST">
<label>Full Name</label><input name="name" value="{{user['name']}}" required>
<label>Email</label><input type="email" name="email" value="{{user['email']}}" required>
<label>Degree</label><select id="degree" name="degree" required onchange="loadSubjects()">
{% for d in degrees %}<option value="{{d}}" {% if d==user['degree'] %}selected{% endif %}>{{d}}</option>{% endfor %}
</select>
<label>Branch / Stream</label><select name="branch" required>{% for b in branches %}<option {% if b==user['branch'] %}selected{% endif %}>{{b}}</option>{% endfor %}</select>
<label>Course / Major / Specialization</label><input name="course" value="{{user['course']}}" required>
<label>Subjects / Main Courses</label><div id="subjectsBox" class="subject-box"></div>
<div class="two-col"><div><label>Batch</label><input name="batch" value="{{user['batch']}}" required></div>
<div><label>Semester</label><select name="semester" required>{% for i in range(1,9) %}<option {% if user['semester']==i|string %}selected{% endif %}>{{i}}</option>{% endfor %}</select></div></div>
<button class="btn primary full">Save Changes</button>
<a class="btn light full center" href="/admin/dashboard">Cancel</a>
</form></div></main><footer>© 2026 Yuva Skill Map</footer>
<script>window.SUBJECTS={{subjects_map|tojson}};window.SELECTED_SUBJECTS={{selected_subjects|tojson}};</script>
<script src="/static/script.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
 const d=document.getElementById("degree"), box=document.getElementById("subjectsBox");
 function render(){
   box.innerHTML="";
   (window.SUBJECTS[d.value]||[]).forEach(s=>{
     const l=document.createElement("label"); l.className="subject-option";
     const checked=window.SELECTED_SUBJECTS.includes(s)?"checked":"";
     l.innerHTML=`<input type="checkbox" name="subjects" value="${s}" ${checked}> ${s}`;
     box.appendChild(l);
   });
 }
 d.addEventListener("change",render); render();
});
</script></body></html>

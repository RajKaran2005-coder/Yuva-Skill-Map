<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="navbar"><a class="brand" href="/">Yuva Skill Map</a><nav><a href="/">Home</a><a href="/login">Login</a></nav></header><main class="form-page"><div class="form-card wide"><h1>Create Student Profile</h1><p>Choose your degree, course and subjects.</p>{% if error %}<div class="alert error">{{error}}</div>{% endif %}<form method="POST" onsubmit="return validateRegister()"><label>Full Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Degree</label><select id="degree" name="degree" required onchange="loadSubjects()"><option value="">Select degree</option>{% for d in degrees %}<option>{{d}}</option>{% endfor %}</select><label>Branch / Stream</label><select name="branch" required><option value="">Select</option>{% for b in branches %}<option>{{b}}</option>{% endfor %}</select><label>Course / Major / Specialization</label><input name="course" required placeholder="Example: Computer Science / English Honours / Finance"><label>Subjects / Main Courses</label><div id="subjectsBox" class="subject-box"><span class="muted">Select a degree first.</span></div><div class="two-col"><div><label>Batch / Graduation Year</label><input name="batch" placeholder="2028" required></div><div><label>Semester</label><select name="semester" required><option value="">Select</option>{% for i in range(1,9) %}<option>{{i}}</option>{% endfor %}</select></div></div><label>Password</label><div class="password-wrap"><input type="password" id="password" name="password" minlength="6" required><button type="button" class="eye-btn" onclick="togglePassword('password',this)">👁</button></div><label>Confirm Password</label><div class="password-wrap"><input type="password" id="confirmPassword" minlength="6" required><button type="button" class="eye-btn" onclick="togglePassword('confirmPassword',this)">👁</button></div><button class="btn primary full">Create Account</button></form><p class="center">Already registered? <a href="/login">Login</a></p></div></main><footer>© 2026 Yuva Skill Map</footer><script>window.SUBJECTS={{subjects_map|tojson}};</script><script src="/static/script.js"></script></body></html>
